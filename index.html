<style>
/* Layout: halaman publik satu kolom, aplikasi dengan tab bawah di ponsel dan sidebar di layar lebar */
:root{
  --bg:#ffffff; --surface:#ffffff; --fg:#1c1c1e; --muted:#6e6e73; --line:#e5e5ea;

*{box-sizing:border-box}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;
  border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn-gold{background:var(--gold);color:#1b1404}

.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}

.top .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--fg);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.logo{width:44px;height:34px;background:transparent;display:grid;place-items:center}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

.shell{display:block}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{min-height:36px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

const DB=(()=>{
  const KEY='aren-jariyah:data',SES='aren-jariyah:sesi',VER=2,MEKEY='aren-jariyah:saya';
  const T={P,TX,LAHAN,ABADI,HASILPAKAI,INFO,AUDIT,ASET,PROYEK,KEG,AKUI,BAGI,ALIH,UNDANGAN,FORUM,VOTING,ARSIP};
  const store=(()=>{try{const s=window.localStorage;s.setItem('__t','1');s.removeItem('__t');return s}catch(e){return null}})();
  let timer=0;
  const stamp=()=>{const n=new Date();return n.toISOString().slice(0,10)+' '+n.toTimeString().slice(0,5)};
  function flush(){clearTimeout(timer);if(SB_AUTH){try{SB.push()}catch(e){}return}if(!store)return;try{const o={v:VER};for(const k in T)o[k]=T[k];store.setItem(KEY,JSON.stringify(o))}catch(e){}}
  function save(){if(!store)return;clearTimeout(timer);timer=setTimeout(flush,150)}
  function load(){
    if(!store)return;
    try{
      const o=JSON.parse(store.getItem(KEY)||'null');
      if(o&&o.v===VER)for(const k in T)if(Array.isArray(o[k]))T[k].splice(0,T[k].length,...o[k]);
      ME=P.find(x=>x.id===store.getItem(MEKEY))||null;

  const say=(m,row)=>{if(m)audit(typeof m==='function'?m(row):m)};
  return{
    load,save,flush,audit,col:T,
    find:(t,id)=>T[t].find(r=>r.id===id),
    nextId:(pre,t,pad)=>pre+'-'+String(Math.max(0,...T[t].map(r=>parseInt(String(r.id).split('-').pop(),10)||0))+1).padStart(pad,'0'),
    add(t,row,msg){if(t==='INFO')T[t].unshift(row);else T[t].push(row);say(msg,row);save();return row},
    remove(t,id,msg){const i=T[t].findIndex(x=>x.id===id);if(i<0)return null;const r=T[t].splice(i,1)[0];say(msg,r);save();return r},
    update(t,id,patch,msg){const r=T[t].find(x=>x.id===id);if(!r)return null;Object.assign(r,patch);say(msg,r);save();return r},
    setMe(id){ME=P.find(x=>x.id===id)||null;if(!store)return;try{store.setItem(MEKEY,id)}catch(e){}},
    setRole(r){if(!store)return;try{r?store.setItem(SES,r):store.removeItem(SES)}catch(e){}},
    reset(){if(store){try{store.removeItem(KEY);store.removeItem(SES);store.removeItem(MEKEY);store.removeItem(PKEY)}catch(e){}}location.hash='';location.reload()},
    sync(e){if(e.key===KEY){load();if(!document.querySelector('#sheet-root .sheet'))render()}}
  };
})();

const hex2=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pinH(pin,salt){
  try{if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
    return 'p2$'+hex2(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:100000},k,256))}}catch(e){}
  let h=salt+':'+pin;for(let i=0;i<5000;i++)h=hsh(h+salt+i);return 's1$'+h;
}
const newSalt=()=>{const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<12;i++)a[i]=Math.random()*256}return hex2(a)};

function pinLemah(pn,hp){
  if(/^(\d)\1+$/.test(pn))return 'PIN tidak boleh angka yang sama semua.';
  const d=pn.split('').map(Number),st=d.slice(1).map((x,i)=>x-d[i]);
  if(st.every(x=>x===1)||st.every(x=>x===-1))return 'PIN tidak boleh berurutan.';
  if(hp&&(hp.endsWith(pn)||hp.slice(1).startsWith(pn)))return 'PIN tidak boleh sama dengan bagian nomor HP.';
  if(['1212','2580','1122','1004','2000','2024','2025','2026','121212','112233','159753'].includes(pn))return 'PIN terlalu mudah ditebak.';
  return '';
}

/* ---- login biometrik (WebAuthn perangkat) ----
   Sidik jari / Face ID hanya membuka kunci di perangkat ini. PIN disimpan terenkripsi (AES-GCM, kunci tidak dapat diekspor di IndexedDB)
   lalu dikirim lewat alur login biasa, jadi batas percobaan dan validasi server tetap berlaku. */
const BKEY='aren-jariyah:bio',BNO='aren-jariyah:bio-no';let BIO_OK=false,BP=null;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const bioRand=n=>crypto.getRandomValues(new Uint8Array(n));
const bioData=()=>{try{return JSON.parse(localStorage.getItem(BKEY)||'null')}catch(e){return null}};
const bioOn=()=>BIO_OK&&!!bioData();
const idb=(m,k,v)=>new Promise((ok,no)=>{const q=indexedDB.open('aren-jariyah-bio',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onerror=()=>no(q.error);
  q.onsuccess=()=>{const t=q.result.transaction('k',m==='r'?'readonly':'readwrite'),o=t.objectStore('k'),r=m==='r'?o.get(k):m==='w'?o.put(v,k):o.delete(k);t.oncomplete=()=>{q.result.close();ok(r.result)};t.onerror=()=>no(t.error)}});
function bioClear(){try{localStorage.removeItem(BKEY)}catch(e){}idb('d','k').catch(()=>{})}
(async()=>{try{BIO_OK=!!(window.isSecureContext&&window.PublicKeyCredential&&crypto.subtle&&indexedDB&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){}
  if(BIO_OK){const h=document.getElementById('lg-h');if(h&&!h.value&&!document.getElementById('lg-p').value)try{rerender()}catch(e){}}})();
async function bioEnable(hp,pin){
  const cr=await navigator.credentials.create({publicKey:{challenge:bioRand(32),rp:{name:'Aren Jariyah'},user:{id:bioRand(16),name:hp,displayName:hp},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
  const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']),iv=bioRand(12);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify({hp,pin})));
  await idb('w','k',key);localStorage.setItem(BKEY,JSON.stringify({hp,cid:b64(cr.rawId),iv:b64(iv),ct:b64(ct)}));
}
async function bioLogin(){
  const d=bioData();if(!d){toast('Biometrik belum diaktifkan.');return}
  try{
    await navigator.credentials.get({publicKey:{challenge:bioRand(32),allowCredentials:[{type:'public-key',id:ub64(d.cid),transports:['internal']}],userVerification:'required',timeout:60000}});
    const key=await idb('r','k');if(!key)throw new Error('kunci');
    const o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(d.iv)},key,ub64(d.ct))));
    const h=document.getElementById('lg-h'),p=document.getElementById('lg-p');if(!h||!p)return;
    h.value=o.hp;p.value=o.pin;window.__bioTry=1;
    const f=h.closest('form');f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));
    setTimeout(()=>{try{p.value=''}catch(e){}},1500);
  }catch(e){
    if(e&&(e.name==='NotAllowedError'||e.name==='AbortError')){toast('Verifikasi biometrik dibatalkan.');return}
    bioClear();toast('Data biometrik tidak valid. Masuk dengan PIN lalu aktifkan lagi.');try{rerender()}catch(_){}
  }
}

function petaLL(x,y,z){const n=256*Math.pow(2,z),a=Math.PI*(1-2*y/n);return{lat:180/Math.PI*Math.atan(Math.sinh(a)),lng:x/n*360-180}}
function initPeta(){
 const box=document.getElementById('pmap');if(!box||box.dataset.on)return;box.dataset.on='1';
 const inp=document.getElementById('l-ll'),tl=box.querySelector('.pm-t'),pn=box.querySelector('.pm-pin');
 const ZMIN=3,ZMAX=21,TMAX=19;
 let z=+box.dataset.z||15,pin=null,g=null,lastTap=null;const cache={},ptr=new Map();
 const m=(inp.value||'').split(',').map(Number);
 if(inp.value.trim()&&m.length===2&&isFinite(m[0])&&isFinite(m[1]))pin={lat:m[0],lng:m[1]};
 const st=pin||{lat:-8.6565,lng:116.531};let c=petaXY(st.lat,st.lng,z);
 const cl=v=>Math.max(ZMIN,Math.min(ZMAX,v));
 function prune(){let ok=true;for(const k in cache)if(cache[k].need&&!cache[k].im.complete)ok=false;if(ok)for(const k in cache)if(!cache[k].need){cache[k].im.remove();delete cache[k]}}
 function draw(){
  const w=box.clientWidth,h=box.clientHeight,tz=Math.min(TMAX,Math.round(z)),ts=256*Math.pow(2,z-tz),n=Math.pow(2,tz),x0=c.x-w/2,y0=c.y-h/2;
  for(const k in cache)cache[k].need=false;
  for(let tx=Math.floor(x0/ts);tx<=Math.floor((x0+w)/ts);tx++)for(let ty=Math.floor(y0/ts);ty<=Math.floor((y0+h)/ts);ty++){
   if(ty<0||ty>=n)continue;
   const key=tz+'/'+tx+'/'+ty;let o=cache[key];
   if(!o){const im=new Image();im.alt='';im.draggable=false;im.decoding='async';
    im.onerror=()=>box.classList.add('pm-off');im.onload=()=>{box.classList.remove('pm-off');prune()};
    im.src='https://tile.openstreetmap.org/'+tz+'/'+(((tx%n)+n)%n)+'/'+ty+'.png';tl.appendChild(im);o=cache[key]={im,tx,ty,tz}}
   o.need=true;
  }
  for(const k in cache){const o=cache[k],f=Math.pow(2,z-o.tz);let X=o.tx*256*f-x0,Y=o.ty*256*f-y0;

 function tap(e){

  box.style.cursor='grabbing'});
 box.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!g)return;
  if(g.pinch){if(ptr.size<2)return;const [a,b]=[...ptr.values()],r=box.getBoundingClientRect(),d=Math.hypot(a.x-b.x,a.y-b.y)||1;zoomAt(g.z0+Math.log2(d/g.d0),(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
  const dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.abs(dx)+Math.abs(dy)>6)g.mv=true;if(g.mv){c={x:g.cx-dx,y:g.cy-dy};draw()}});
 box.addEventListener('pointerup',e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);const o=g;

  w.querySelector('[data-v="-1"]').disabled=idx===0;w.querySelector('[data-v="1"]').disabled=idx===tiles.length-1;

function fsub(items){

function withSub(html,tab){
  if(tab==='dash'||tab==='aset')return html;
  const t=document.createElement('template');t.innerHTML=html;
  const head=[],bars=[],groups=[],intro=[];let cur=null;
  [...t.content.children].forEach(el=>{
    if(el.matches('h1,.lead')){head.push(el);return}
    if(el.tagName==='SECTION'){const h=el.querySelector('h2');cur={n:h?h.textContent.trim():'Lainnya',els:[el]};groups.push(cur);return}
    if(el.classList.contains('row')&&el.children.length&&[...el.children].every(c=>c.tagName==='BUTTON')){bars.push(el);return}
    (cur?cur.els:intro).push(el);
  });
  if(intro.length)groups.unshift({n:(tab==='partisipan'&&S.role!=='partisipan'?'Daftar':SUB0[tab]||'Ringkasan'),els:intro});
  if(groups.length<2)return html;
  const k=Math.max(0,Math.min(groups.length-1,+(S.filter.sub||0)));
  const out=el=>el.outerHTML;
  return head.map(out).join('')+bars.map(out).join('')+groups[k].els.map(out).join('')+
  fsub(groups.map((g,i)=>{const l=SUBL[g.n]||g.n;return [l,SUBI[l]||'list','sub',i,i===k]}));
}

  async function doPush(){
    if(!ready)return;if(busy){again=true;return}busy=true;
    try{
      const T=TT(),up=[],cur={},bad=new Set();
      for(const k in T){const n=T[k].length;T[k].forEach((r,i)=>{const id=kid(r);if(r._t==null)r._t=Date.now()+((k==='INFO'||k==='AUDIT')?(n-i):i)/1000;const s=JSON.stringify(r);cur[k+'|'+id]=1;if(SNAP[k+'|'+id]!==s)up.push({kolom:k,id,data:r,s})})}
      const grp={},st={};up.forEach(x=>(grp[x.kolom]=grp[x.kolom]||[]).push(x));
      const post=ch=>rest('koleksi?on_conflict=kolom,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(ch.map(x=>({kolom:x.kolom,id:x.id,data:x.data})))});
      for(const k in grp){
        if(blk[k]&&blk[k]>Date.now()){bad.add(k);st[k]=403;continue}
        const L=grp[k];
        for(let i=0;i<L.length;i+=100){const ch=L.slice(i,i+100),r=await post(ch);
          if(r.ok){ch.forEach(x=>{SNAP[x.kolom+'|'+x.id]=x.s});continue}
          if(r.s>=400&&r.s<500&&ch.length>1){/* satu baris ditolak (hak akses): coba satu per satu */
            for(const x of ch){const r1=await post([x]);if(r1.ok)SNAP[x.kolom+'|'+x.id]=x.s;else{bad.add(k);st[k]=r1.s}}
          }else{bad.add(k);st[k]=r.s}
        }
        if(st[k]===401||st[k]===403)blk[k]=Date.now()+30000;
      }
      const del={};for(const key in SNAP)if(!cur[key]){const j=key.indexOf('|');(del[key.slice(0,j)]=del[key.slice(0,j)]||[]).push(key.slice(j+1))}
      for(const k in del)for(let i=0;i<del[k].length;i+=50){const ids=del[k].slice(i,i+50);
        const r=await rest('koleksi?kolom=eq.'+k+'&id=in.('+ids.map(x=>'"'+x.replace(/"/g,'')+'"').join(',')+')',{method:'DELETE'});
        if(r.ok)ids.forEach(x=>{delete SNAP[k+'|'+x]});else{bad.add(k);st[k]=r.s}}

        const net=w.some(k=>st[k]===0||st[k]===undefined),den=w.filter(k=>st[k]===401||st[k]===403||(st[k]>=400&&st[k]<500));
        toast(net&&!den.length?'Belum tersambung ke server. Perubahan ditahan di perangkat dan dicoba lagi otomatis.':'Server menolak menyimpan '+w.join(', ')+'. Peran Anda belum diizinkan menulis di tabel ini. Hubungi admin untuk memasang patch hak akses.')}
      if(!w.length)warned=false;

  }

/* ---------- proyek ---------- */
const prSt=p=>p.prog>=100?'Selesai':p.prog<=0?'Baru':'Berjalan';
const prCol=p=>p.prog>=100?'':p.prog<=0?'mute':'gold';
function prFiltered(){
  const f=S.filter,st=f.pst||'Semua',q=(f.pq||'').toLowerCase().trim(),so=f.pso||'baru';
  let L=PROYEK.filter(p=>(st==='Semua'||prSt(p)===st)&&(!q||(p.n+' '+p.aset+' '+p.tim+' '+p.next).toLowerCase().includes(q)));
  const pct=p=>p.target?prReal(p)/p.target:0;
  if(so==='progres')L=L.slice().sort((x,y)=>y.prog-x.prog);
  else if(so==='dana')L=L.slice().sort((x,y)=>pct(y)-pct(x));
  else if(so==='nama')L=L.slice().sort((x,y)=>x.n.localeCompare(y.n));
  else L=L.slice().reverse();
  return L;
}
function prCard(p){
  const open=S.filter.prOpen===p.id,mg=canManage('proyek'),dp=p.target?Math.min(100,Math.round(prReal(p)/p.target*100)):0,sisa=Math.max(0,p.target-prReal(p)),stt=prSt(p);
  return '<article class="item prc'+(open?' open':'')+'" data-pid="'+esc(p.id)+'">'+
  '<div class="prh" role="button" tabindex="0" aria-expanded="'+open+'" data-act="prToggle" data-v="'+esc(p.id)+'">'+
   '<div class="prr"><div class="prt"><b>'+esc(p.n)+'</b><span class="muted prs">'+esc(p.id)+' · '+(p.aset&&p.aset!=='Umum'?esc(p.aset):'Umum')+'</span></div><span class="chip '+prCol(p)+'">'+stt+'</span><span class="prch" aria-hidden="true">'+chevR+'</span></div>'+
   '<div class="prp"><div class="bar'+(p.prog>=100?'':' gold')+'" role="progressbar" aria-label="Progres '+esc(p.n)+'" aria-valuenow="'+p.prog+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+Math.min(100,p.prog)+'%"></i></div><b class="num">'+p.prog+'%</b></div>'+
   '<div class="prm"><span>'+rp(prReal(p))+' <em>dari '+rp(p.target)+'</em></span><span class="chip mute">Dana '+dp+'%</span></div></div>'+
  (open?'<div class="prd"><div class="kv"><div><span>Target dana</span>'+rp(p.target)+'</div><div><span>Realisasi dana</span>'+rp(prReal(p))+'</div><div><span>Sisa kebutuhan</span>'+rp(sisa)+'</div><div><span>Tim pelaksana</span>'+esc(p.tim)+'</div><div><span>Agenda berikutnya</span>'+esc(p.next)+'</div><div><span>Aset terkait</span>'+esc(p.aset||'Umum')+'</div></div>'+
   '<div class="bar" style="margin-top:2px" aria-hidden="true"><i style="width:'+dp+'%;background:var(--blue)"></i></div><span class="muted" style="font-size:12px">Pendanaan '+dp+'% terpenuhi</span>'+(pdnOn()?'<div class="note" style="margin-top:8px">Warga dapat mendanai proyek ini lewat RencoPay dengan kode <b>'+esc(p.id)+'</b>. Dana dari RencoPay: <b>'+rp(PDN.by[p.id]||0)+'</b>'+(PDN.ok===false?' (belum bisa membaca data RencoPay)':'')+'.</div>':'')+'</div>':'')+
  (mg?'<div class="pra"><button type="button" class="btn btn-line btn-sm" data-act="prEdit" data-v="'+esc(p.id)+'">'+ic('pengaturan').replace('class="ico"','class="ico" style="width:16px;height:16px"')+' Edit</button><button type="button" class="btn btn-line btn-sm prdel" data-act="prHapus" data-v="'+esc(p.id)+'">'+ic('trash').replace('class="ico"','class="ico" style="width:16px;height:16px"')+' Hapus</button></div>':'')+
  '</article>';
}
function prList(){
  pdnMuat(null,()=>{try{rerender()}catch(e){}});
  const L=prFiltered();
  if(!PROYEK.length)return kosong('Belum ada proyek.');
  if(!L.length)return kosong('Tidak ada proyek yang cocok dengan pencarian atau filter.');
  return L.map(prCard).join('');
}

  const f=S.filter,st=f.pst||'Semua',so=f.pso||'baru',n=PROYEK.length;

  '<div class="stats prstats">'+stat('Total proyek',n)+stat('Rata-rata progres',av+'%')+stat('Target dana',rpc(tg))+stat('Realisasi',rpc(rl)+(tg?' ('+Math.min(100,Math.round(rl/tg*100))+'%)':''))+'</div>'+
  '<div class="prtool"><div class="field" style="margin:0"><label for="pr-q" class="sr">Cari proyek</label><input id="pr-q" type="search" placeholder="Cari nama, aset, atau tim" value="'+esc(f.pq||'')+'" autocomplete="off"></div>'+
  '<div class="field" style="margin:0"><label for="pr-so" class="sr">Urutkan</label><select id="pr-so" data-change="pso">'+[['baru','Terbaru'],['progres','Progres tertinggi'],['dana','Pendanaan tertinggi'],['nama','Nama A-Z']].map(o=>'<option value="'+o[0]+'"'+(o[0]===so?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div></div>'+
  '<div class="seg" role="group" aria-label="Filter status">'+['Semua','Baru','Berjalan','Selesai'].map(k=>'<button type="button" aria-pressed="'+(k===st)+'" data-act="prFilter" data-v="'+k+'">'+k+' ('+cnt(k)+')</button>').join('')+'</div>'+
  '<div class="list" id="pr-list">'+prList()+'</div>'+

  '<span class="muted" style="font-size:13px">'+x.id+' \u00b7 '+tgl(x.tgl)+' \u00b7 kontribusi '+rp(x.kontrib||0)+'</span><span style="font-size:13.5px">'+esc(x.alasan)+'</span>'+tl(x)+

function alihView(){

function alihAdmin(){
  const H=[...ALIH].sort((a,b)=>(b.st==='Menunggu persetujuan')-(a.st==='Menunggu persetujuan'));
  return '<section class="sec"><h2>Pengajuan pengalihan</h2><div class="list">'+(H.length?H.map(alihCard).join(''):kosong('Belum ada pengajuan pengalihan.'))+'</div></section>'

function tPartisipan(){const h=tPartisipan0();return S.role==='admin'?h+alihAdmin()+hpAdmin():(S.role==='pengurus'?h+alihAdmin():h)}
Object.assign(A,{
  formAlih:wzOpen,
  wzGo:v=>{WZ.step=+v;wzDraw(1)},wzNext:()=>{if(wzOk()){WZ.step++;wzDraw(1)}},wzBack:()=>{if(WZ.step>0){WZ.step--;wzDraw(1)}},
  wzDari:v=>{WZ.dari=v;WZ.aset=[];WZ.ke='';wzDraw()},
  wzTog:v=>{const i=WZ.aset.indexOf(v);i<0?WZ.aset.push(v):WZ.aset.splice(i,1);wzDraw()},
  wzAll:()=>{WZ.aset=asetOf(WZ.dari).filter(a=>!kunci(a)).map(a=>a.id);wzDraw()},wzNone:()=>{WZ.aset=[];wzDraw()},
  wzKe:v=>{WZ.ke=v;wzDraw()},wzAl:v=>{WZ.alasan=ALASAN[+v]+'. ';wzDraw()},wzCk:()=>{WZ.ok=!WZ.ok;wzDraw()},
  wzKirim:()=>{
    if(!ALIHOK()){toast(alihMsg());return}
    const d=P.find(p=>p.id===WZ.dari),k=P.find(p=>p.id===WZ.ke),L=ASET.filter(a=>WZ.aset.includes(a.id));
    if(!d||!k||!L.length||!WZ.ok)return;
    if(L.some(a=>kunci(a)||!pemilik(a).has(d.id))){toast('Ada aset yang tidak dapat dialihkan lagi. Mulai ulang pengajuan.');return}
    const id=DB.nextId('PA','ALIH',3);
    DB.add('ALIH',{id,dari:d.id,dariN:d.nama,ke:k.id,keN:k.nama,aset:L.map(a=>a.id),asetN:L.map(a=>a.n),kontrib:sum(L,a=>kontrib(a,d.id)),alasan:WZ.alasan.trim(),tgl:todayISO(),st:'Menunggu persetujuan'},'Pengajuan pengalihan '+id+': '+L.length+' aset dari '+d.id+' kepada '+k.id);
    closeSheet();toast('Diajukan. Hak berpindah setelah pengurus menyetujui.');rerender()
  },
  alihSetuju:v=>{
    if(!['admin','pengurus'].includes(S.role))return;
    const x=ALIH.find(r=>r.id===v);if(!x||x.st!=='Menunggu persetujuan')return;
    const L=x.aset.map(i=>ASET.find(a=>a.id===i)).filter(Boolean);
    if(L.some(a=>!pemilik(a).has(x.dari))){toast('Pemegang aset sudah berubah. Tolak pengajuan ini dan minta pengajuan baru.');return}
    L.forEach(a=>DB.update('ASET',a.id,{alih:(a.alih||[]).concat({dari:x.dari,ke:x.ke,tgl:todayISO(),ref:x.id})}));
    DB.update('ALIH',v,{st:'Disetujui',tglp:todayISO()},'Menyetujui pengalihan '+v);toast('Pengalihan disetujui. Hak aset berpindah.');rerender()
  },
  alihTolak:v=>{if(!['admin','pengurus'].includes(S.role))return;DB.update('ALIH',v,{st:'Ditolak'},'Menolak pengalihan '+v);toast('Pengajuan ditolak.');rerender()},
  alihBatal:v=>{const x=ALIH.find(r=>r.id===v);if(!x||x.st!=='Menunggu persetujuan'||!(S.role==='admin'||(ME&&ME.id===x.dari)))return;DB.update('ALIH',v,{st:'Dibatalkan'},'Membatalkan pengajuan pengalihan '+v);toast('Pengajuan dibatalkan.');rerender()}
});

/* ================= UNDANGAN ADMIN + VERIFIKASI HP VIA WHATSAPP TERBALIK ================= */
const KALF='ABCDEFGHJKMNPQRSTUVWXYZ23456789',VEXP=48*3600e3;
const newKode=n=>{const a=new Uint8Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.random()*256}return [...a].map(x=>KALF[x%KALF.length]).join('')};
const normKode=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmtKode=k=>k.slice(0,4)+'-'+k.slice(4);
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hpIntl=hp=>{const n=normHp(hp);return n[0]==='+'?n.slice(1):'62'+n.slice(1)};
const hpLokal=n=>String(n).startsWith('62')?'0'+String(n).slice(2):'+'+n;
const waLink=(no,txt)=>'https://wa.me/'+no+(txt?'?text='+encodeURIComponent(txt):'');
const akHpv=a=>a.hpv||(a.roles.includes('admin')?'ok':'belum');
const vOk=a=>!!(a.vk&&a.vts&&Date.now()-a.vts<VEXP);
const akOfP=p=>AKUN.find(a=>a.pid===p.id);
const hpTerverif=p=>{const a=akOfP(p);return a?akHpv(a)==='ok':(p.hpv==='ok'||p.hpv==='admin')};
function hpChip(p,plain){const ok=hpTerverif(p);return (plain?'':' ')+'<span class="chip'+(ok?'':' gold')+'">'+(ok?'HP terverifikasi':'HP belum diverifikasi')+'</span>'}
const XSVG='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function hpBanner(){
  const a=akCur();if(!a)return '';const st=akHpv(a);if(st==='ok')return '';
  return '<div class="note" style="margin-bottom:12px"><b>'+(st==='menunggu'?'Menunggu pengurus.':'Nomor HP belum terverifikasi.')+'</b> '+(st==='menunggu'?'Pengurus akan mencocokkan pesan WhatsApp Anda.':(hpLock()?'Menu lain terkunci sampai verifikasi selesai.':'Verifikasi diperlukan sebelum Anda dapat disetujui sebagai partisipan aktif.'))+' <button type="button" class="btn btn-green btn-sm" style="margin-top:8px" data-act="hpVerif">'+(st==='menunggu'?'Lihat status':'Verifikasi sekarang')+'</button></div>';
}
function hpSheet(){
  const a=akCur();if(!a)return;const st=akHpv(a),wa=PENG.wa||'';
  const head='<div class="shead"><h2 style="margin:0">Verifikasi nomor HP</h2><button type="button" class="xbtn" data-act="closeSheet" aria-label="Tutup">'+XSVG+'</button></div>';
  if(st==='ok')return sheet(head+'<div class="note ok" style="margin-top:12px">Nomor HP Anda sudah terverifikasi.</div>');
  if(!wa)return sheet(head+'<div class="note" style="margin-top:12px">Nomor WhatsApp komunitas belum diatur admin. Hubungi pengurus, lalu coba lagi.</div>');
  /* 3 langkah: 1 buat kode, 2 kirim lewat WhatsApp, 3 tunggu pengurus */
  const ok=vOk(a),step=!ok?1:(st==='menunggu'?3:2);
  const bar='<div class="vst" role="list" aria-label="Langkah verifikasi">'+['Buat kode','Kirim','Tunggu'].map((t,i)=>'<i role="listitem" class="'+(i+1<step?'done':i+1===step?'on':'')+'"'+(i+1===step?' aria-current="step"':'')+'>'+(i+1)+'. '+t+'</i>').join('')+'</div>';
  const no='<p class="muted" style="margin:0 0 12px;font-size:13px">Nomor: <b>'+esc(a.hp)+'</b></p>';
  let body;
  if(step===1){
    body=(a.vk?'<div class="note" style="margin-bottom:10px">Kode lama kedaluwarsa. Buat kode baru.</div>':'')+
      '<p style="font-size:14px;margin:0 0 12px">Buat kode unik untuk membuktikan nomor ini milik Anda.</p>'+
      '<button type="button" class="btn btn-green" style="width:100%" data-act="hpBuat">Buat kode</button>';
  }else{
    const txt='Verifikasi Aren Jariyah\nKode: AJ-'+a.vk+'\nNama: '+a.nama;
    const kode='<div class="item" style="text-align:center;margin-bottom:12px"><span class="label">Kode Anda</span><b style="font-size:28px;letter-spacing:.12em;font-family:ui-monospace,monospace">AJ-'+esc(a.vk)+'</b><span class="muted" style="font-size:12px">Berlaku 48 jam</span></div>';
    if(step===2){
      body=kode+'<p style="font-size:14px;margin:0 0 12px">Kirim pesan yang sudah terisi, <b>dari nomor di atas</b>, tanpa mengubah kode.</p>'+
        '<a class="btn btn-green" style="width:100%" href="'+esc(waLink(wa,txt))+'" target="_blank" rel="noopener" data-act="hpKirim">Kirim lewat WhatsApp</a>'+
        '<p style="text-align:center;margin:10px 0 0"><button type="button" class="btn btn-line btn-sm" data-act="hpBuat">Buat kode baru</button></p>';
    }else{
      body=kode+'<div class="note" style="margin-bottom:12px"><b>Menunggu pengurus.</b> Pesan Anda sedang dicocokkan.</div>'+
        '<div class="row"><a class="btn btn-line" href="'+esc(waLink(wa,txt))+'" target="_blank" rel="noopener" data-act="hpKirim">Kirim ulang</a><button type="button" class="btn btn-green" data-act="closeSheet">Tutup</button></div>';
    }
  }
  sheet(head+'<div style="height:12px"></div>'+bar+no+body);
}

  return '<section class="sec"><h2>Reset PIN</h2><div class="list">'+(W.length?W.map(kartu).join(''):kosong('Tidak ada permintaan reset PIN.'))+'</div></section>';

  '<div class="list">'+(W.length?W.map(kartu).join(''):kosong('Tidak ada nomor yang menunggu verifikasi.'))+'</div></section>';

   '<form data-form="undang" autocomplete="off">'+F('ud-n','Nama yang diundang','text','required')+F('ud-h','Nomor HP (WhatsApp) yang diundang','tel','required inputmode="tel"')+'<div class="row"><button class="btn btn-green" type="submit">Buat kode undangan</button></div></form>'+

}
Object.assign(A,{
  akUndang:()=>{if(S.role==='admin')undSheet()},
  udCabut:v=>{const u=DB.find('UNDANGAN',v);if(S.role!=='admin'||!u||u.st!=='aktif')return;DB.update('UNDANGAN',v,{st:'dicabut'},'Mencabut undangan '+v+' ('+u.nama+')');toast('Undangan dicabut.');undSheet()},
  udSalin:v=>{const u=DB.find('UNDANGAN',v);if(S.role!=='admin'||!u)return;try{navigator.clipboard.writeText(fmtKode(u.kode)).then(()=>toast('Kode tersalin.'),()=>toast('Pilih kode lalu salin manual.'))}catch(e){toast('Pilih kode lalu salin manual.')}},
  waSet:()=>{if(S.role!=='admin')return;sheet(head('WhatsApp komunitas','Nomor ini menerima pesan verifikasi dari calon partisipan. Gunakan nomor yang dipegang pengurus dan dibuka rutin.')+'<form data-form="setwa">'+F('wa-n','Nomor WhatsApp komunitas','tel','inputmode="tel" value="'+esc(PENG.wa?hpLokal(PENG.wa):'')+'"')+'<div class="row"><button class="btn btn-green" type="submit">Simpan</button><button class="btn btn-line" type="button" data-act="closeSheet">Batal</button></div></form>')},
  rstKirim:v=>{akFresh();const a=AKUN.find(x=>x.id===v);if(!a||!a.rst||Date.now()-a.rst.ts>=VEXP)return;a.rst.st='menunggu';akSave();try{DB.audit('Meminta reset PIN ('+a.nama+')')}catch(e){}setTimeout(()=>{S.rstAcc=a.id;rstSheet()},400)},
  rstOk:v=>{
    if(S.role!=='admin')return;akFresh();
    const a=AKUN.find(x=>x.id===v);
    if(!a||a.id===S.acc||!a.rst||a.rst.st!=='menunggu'||Date.now()-a.rst.ts>=VEXP){toast('Permintaan sudah kedaluwarsa atau status berubah.');rerender();return}
    if((a.roles.includes('admin')||a.roles.includes('pengurus'))&&S.role!=='admin'){toast('Reset PIN akun admin atau pengurus hanya oleh admin.');return}
    if(!confirm('Konfirmasi: pesan berisi kode RP-'+a.rst.k+' benar-benar masuk ke WhatsApp komunitas dari nomor '+a.hp+'?'))return;
    if(SB_AUTH){SB.resetPin(a);return}
    a.salt=a.rst.salt;a.pin=a.rst.pin;a.v=2;delete a.rst;akSave();gagalCatat(normHp(a.hp),true);gagalCatat('reset:'+normHp(a.hp),true);
    DB.audit('Mereset PIN '+a.nama+' ('+a.hp+')');toast('PIN direset. Pengguna dapat masuk dengan PIN baru.');rerender();
  },
  rstNo:v=>{
    if(S.role!=='admin')return;akFresh();
    const a=AKUN.find(x=>x.id===v);if(!a||a.id===S.acc||!a.rst)return;
    delete a.rst;akSave();DB.audit('Menolak reset PIN '+a.nama);toast('Permintaan reset PIN ditolak.');rerender();
  },

function kpEnd(ok){

document.addEventListener('pointerdown',e=>{

  KD={t,id:t.dataset.id,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,on:false,out:false};
  KD.timer=setTimeout(()=>{
    if(!KD)return;

    const r=t.getBoundingClientRect(),g=t.cloneNode(true);g.className='kpt2 ghost';g.removeAttribute('role');g.removeAttribute('tabindex');

    try{getSelection().removeAllRanges()}catch(x){}document.body.appendChild(g);KD.ghost=g;KD.w=r.width;KD.h=r.height;KD.on=true;t.classList.add('lifted');
    const dz=document.getElementById('kp-dz');if(dz)dz.classList.add('on');

<script>
(function(){
const fm=x=>{const d=String(x).replace(/\D/g,'').replace(/^0+(?=\d)/,'');return d?d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''};
function fix(el){const o=el.value;if(!o)return;const n=fm(o);if(n!==o)el.value=n}
document.addEventListener('input',e=>{const el=e.target;if(!el||!el.hasAttribute||!el.hasAttribute('data-rp'))return;
  const pos=el.selectionStart,dg=String(el.value).slice(0,pos==null?0:pos).replace(/\D/g,'').length,n=fm(el.value);
  if(n===el.value)return;el.value=n;
  if(pos!=null){let k=0,i=0;while(i<n.length&&k<dg){if(/\d/.test(n[i]))k++;i++}try{el.setSelectionRange(i,i)}catch(_){}}});
const scan=r=>{(r.querySelectorAll?r.querySelectorAll('input[data-rp]'):[]).forEach(fix)};
new MutationObserver(m=>{m.forEach(x=>x.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches&&n.matches('input[data-rp]'))fix(n);else scan(n)}))}).observe(document.documentElement,{childList:true,subtree:true});
scan(document);
})();
</script>
