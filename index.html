<style>

const DB=(()=>{
  const KEY='aren-jariyah:data',SES='aren-jariyah:sesi',VER=2,MEKEY='aren-jariyah:saya';
  const T={P,TX,LAHAN,ABADI,HASILPAKAI,INFO,AUDIT,ASET,PROYEK,KEG,AKUI,BAGI,ALIH,UNDANGAN,FORUM,VOTING};
  const store=(()=>{try{const s=window.localStorage;s.setItem('__t','1');s.removeItem('__t');return s}catch(e){return null}})();
  let timer=0;
  const stamp=()=>{const n=new Date();return n.toISOString().slice(0,10)+' '+n.toTimeString().slice(0,5)};
  function flush(){clearTimeout(timer);if(SB_AUTH){try{SB.push()}catch(e){}return}if(!store)return;try{const o={v:VER};for(const k in T)o[k]=T[k];store.setItem(KEY,JSON.stringify(o))}catch(e){}}
  function save(){if(!store)return;clearTimeout(timer);timer=setTimeout(flush,150)}
  function load(){
    if(!store)return;
    try{
      const o=JSON.parse(store.getItem(KEY)||'null');
      if(o&&o.v===VER)for(const k in T)if(Array.isArray(o[k]))T[k].splice(0,T[k].length,...o[k]);
      ME=P.find(x=>x.id===store.getItem(MEKEY))||null;
      const r=store.getItem(SES);if(r&&ACCESS[r])S.role=r;
    }catch(e){}
  }
  function audit(a){AUDIT.unshift({w:stamp(),u:roleName(),a});if(AUDIT.length>200)AUDIT.length=200;save()}
  const say=(m,row)=>{if(m)audit(typeof m==='function'?m(row):m)};
  return{
    load,save,flush,audit,col:T,
    find:(t,id)=>T[t].find(r=>r.id===id),
    nextId:(pre,t,pad)=>pre+'-'+String(Math.max(0,...T[t].map(r=>parseInt(String(r.id).split('-').pop(),10)||0))+1).padStart(pad,'0'),
    add(t,row,msg){if(t==='INFO')T[t].unshift(row);else T[t].push(row);say(msg,row);save();return row},
    remove(t,id,msg){const i=T[t].findIndex(x=>x.id===id);if(i<0)return null;const r=T[t].splice(i,1)[0];say(msg,r);save();return r},
    update(t,id,patch,msg){const r=T[t].find(x=>x.id===id);if(!r)return null;Object.assign(r,patch);say(msg,r);save();return r},
    setMe(id){ME=P.find(x=>x.id===id)||null;if(!store)return;try{store.setItem(MEKEY,id)}catch(e){}},
    setRole(r){if(!store)return;try{r?store.setItem(SES,r):store.removeItem(SES)}catch(e){}},
    reset(){if(store){try{store.removeItem(KEY);store.removeItem(SES);store.removeItem(MEKEY);store.removeItem(PKEY)}catch(e){}}location.hash='';location.reload()},
    sync(e){if(e.key===KEY){load();if(!document.querySelector('#sheet-root .sheet'))render()}}
  };
})();

async function pinH(pin,salt){
  try{if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
    return 'p2$'+hex2(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:100000},k,256))}}catch(e){}
  let h=salt+':'+pin;for(let i=0;i<5000;i++)h=hsh(h+salt+i);return 's1$'+h;
}
const newSalt=()=>{const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<12;i++)a[i]=Math.random()*256}return hex2(a)};
async function akBuatPin(pin){const salt=newSalt();return{salt,pin:await pinH(pin,salt),v:2}}

}
function pinLemah(pn,hp){
  if(/^(\d)\1+$/.test(pn))return 'PIN tidak boleh angka yang sama semua.';
  const d=pn.split('').map(Number),st=d.slice(1).map((x,i)=>x-d[i]);
  if(st.every(x=>x===1)||st.every(x=>x===-1))return 'PIN tidak boleh berurutan.';
  if(hp&&(hp.endsWith(pn)||hp.slice(1).startsWith(pn)))return 'PIN tidak boleh sama dengan bagian nomor HP.';
  if(['1212','2580','1122','1004','2000','2024','2025','2026','121212','112233','159753'].includes(pn))return 'PIN terlalu mudah ditebak.';
  return '';
}

function rcUpdate(c){
  const w=c.closest('.rwrap');if(!w)return;
  const mid=c.scrollLeft+c.clientWidth/2,tiles=[...c.children].filter(x=>x.classList.contains('rc'));
  let best=null,bd=1e9;
  tiles.forEach(t=>{const d=Math.abs(t.offsetLeft+t.offsetWidth/2-mid);t.style.setProperty('--d',Math.min(1,d/(t.offsetWidth*1.6)).toFixed(3));if(d<bd){bd=d;best=t}});
  if(!best)return;
  const idx=tiles.indexOf(best),prev=w.querySelector('.rc.act');
  w.dataset.cur=idx;
  w.querySelector('[data-v="-1"]').disabled=idx===0;w.querySelector('[data-v="1"]').disabled=idx===tiles.length-1;
  if(prev===best)return;
  if(prev){prev.classList.remove('act');prev.removeAttribute('aria-selected')}
  best.classList.add('act');best.setAttribute('aria-selected','true');if(window.rcPlay)rcPlay(best.dataset.v);
  const dsc=w.querySelector('.rdesc');
  dsc.classList.add('sw');clearTimeout(rcUpdate.t);
  rcUpdate.t=setTimeout(()=>{dsc.querySelector('b').textContent=best.dataset.n;dsc.querySelector('p').textContent=best.dataset.d;dsc.classList.remove('sw')},120);
  const mr=document.getElementById('mc-role');if(mr)mr.textContent=best.dataset.n;
}

function withSub(html,tab){
  if(tab==='dash'||tab==='aset')return html;
  const t=document.createElement('template');t.innerHTML=html;
  const head=[],bars=[],groups=[],intro=[];let cur=null;
  [...t.content.children].forEach(el=>{
    if(el.matches('h1,.lead')){head.push(el);return}
    if(el.tagName==='SECTION'){const h=el.querySelector('h2');cur={n:h?h.textContent.trim():'Lainnya',els:[el]};groups.push(cur);return}
    if(el.classList.contains('row')&&el.children.length&&[...el.children].every(c=>c.tagName==='BUTTON')){bars.push(el);return}
    (cur?cur.els:intro).push(el);
  });
  if(intro.length)groups.unshift({n:(tab==='partisipan'&&S.role!=='partisipan'?'Daftar':SUB0[tab]||'Ringkasan'),els:intro});
  if(groups.length<2)return html;
  const k=Math.max(0,Math.min(groups.length-1,+(S.filter.sub||0)));
  const out=el=>el.outerHTML;
  return head.map(out).join('')+bars.map(out).join('')+groups[k].els.map(out).join('')+
  fsub(groups.map((g,i)=>{const l=SUBL[g.n]||g.n;return [l,SUBI[l]||'list','sub',i,i===k]}));
}

const prSt=p=>p.prog>=100?'Selesai':p.prog<=0?'Baru':'Berjalan';
const prCol=p=>p.prog>=100?'':p.prog<=0?'mute':'gold';
function prFiltered(){
  const f=S.filter,st=f.pst||'Semua',q=(f.pq||'').toLowerCase().trim(),so=f.pso||'baru';
  let L=PROYEK.filter(p=>(st==='Semua'||prSt(p)===st)&&(!q||(p.n+' '+p.aset+' '+p.tim+' '+p.next).toLowerCase().includes(q)));
  const pct=p=>p.target?prReal(p)/p.target:0;
  if(so==='progres')L=L.slice().sort((x,y)=>y.prog-x.prog);
  else if(so==='dana')L=L.slice().sort((x,y)=>pct(y)-pct(x));
  else if(so==='nama')L=L.slice().sort((x,y)=>x.n.localeCompare(y.n));
  else L=L.slice().reverse();
  return L;
}
function prCard(p){
  const open=S.filter.prOpen===p.id,mg=canManage('proyek'),dp=p.target?Math.min(100,Math.round(prReal(p)/p.target*100)):0,sisa=Math.max(0,p.target-prReal(p)),stt=prSt(p);

   '<div class="prr"><div class="prt"><b>'+esc(p.n)+'</b><span class="muted prs">'+esc(p.id)+' · '+(p.aset&&p.aset!=='Umum'?esc(p.aset):'Umum')+'</span></div><span class="chip '+prCol(p)+'">'+stt+'</span><span class="prch" aria-hidden="true">'+chevR+'</span></div>'+
   '<div class="prp"><div class="bar'+(p.prog>=100?'':' gold')+'" role="progressbar" aria-label="Progres '+esc(p.n)+'" aria-valuenow="'+p.prog+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+Math.min(100,p.prog)+'%"></i></div><b class="num">'+p.prog+'%</b></div>'+
   '<div class="prm"><span>'+rp(prReal(p))+' <em>dari '+rp(p.target)+'</em></span><span class="chip mute">Dana '+dp+'%</span></div></div>'+
  (open?'<div class="prd"><div class="kv"><div><span>Target dana</span>'+rp(p.target)+'</div><div><span>Realisasi dana</span>'+rp(prReal(p))+'</div><div><span>Sisa kebutuhan</span>'+rp(sisa)+'</div><div><span>Tim pelaksana</span>'+esc(p.tim)+'</div><div><span>Agenda berikutnya</span>'+esc(p.next)+'</div><div><span>Aset terkait</span>'+esc(p.aset||'Umum')+'</div></div>'+

  (mg?'<div class="pra"><button type="button" class="btn btn-line btn-sm" data-act="prEdit" data-v="'+esc(p.id)+'">'+ic('pengaturan').replace('class="ico"','class="ico" style="width:16px;height:16px"')+' Edit</button><button type="button" class="btn btn-line btn-sm prdel" data-act="prHapus" data-v="'+esc(p.id)+'">'+ic('trash').replace('class="ico"','class="ico" style="width:16px;height:16px"')+' Hapus</button></div>':'')+
  '</article>';
}

function pemilik(a){const s=new Set([a.usul,a.oleh,...TX.filter(t=>t.ref===a.n&&t.pid).map(t=>t.pid)].filter(Boolean));(a.alih||[]).forEach(h=>{s.delete(h.dari);s.add(h.ke)});return s}

function kontrib(a,pid){return sum(TX.filter(t=>t.ref===a.n&&t.pid===pid&&t.j==='masuk'&&!/Menunggu|Ditolak/.test(t.st)),t=>t.n)}
function kunci(a){return ALIH.find(x=>x.st==='Menunggu persetujuan'&&x.aset.includes(a.id))}
const ini=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

}

function wzBody(lab){

  if(lab==='Aset'){
    const L=asetOf(WZ.dari),pil=L.filter(a=>!kunci(a)),tot=sum(L.filter(a=>WZ.aset.includes(a.id)),a=>kontrib(a,WZ.dari));

  }

  '<div class="stats" style="margin-top:0">'+stat('Jumlah aset',L.length)+stat('Total kontribusi',rp(sum(L,a=>kontrib(a,dari.id))))+'</div>'+
  '<div class="item"><span class="label">Alasan</span><span>'+esc(WZ.alasan)+'</span></div>'+
  '<div class="note">Setelah diajukan, pengurus meninjau. Hak partisipasi atas aset di atas baru berpindah setelah disetujui, dan semuanya tercatat di audit trail.</div>'+

}

const KALF='ABCDEFGHJKMNPQRSTUVWXYZ23456789',VEXP=48*3600e3;
const newKode=n=>{const a=new Uint8Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.random()*256}return [...a].map(x=>KALF[x%KALF.length]).join('')};

const fmtKode=k=>k.slice(0,4)+'-'+k.slice(4);

const hpIntl=hp=>'62'+normHp(hp).slice(1);
const hpLokal=n=>'0'+String(n).slice(2);
const waLink=(no,txt)=>'https://wa.me/'+no+(txt?'?text='+encodeURIComponent(txt):'');

    DB.add('LAHAN',{id,pemilik:v('l-n'),jenis:v('l-t'),pid:(S.role==='partisipan'&&ME)?ME.id:'',lok:v('l-l'),luas:+v('l-u'),tanah:v('l-s'),pot:'Dinilai saat verifikasi',skema:v('l-k'),tahun:+v('l-j'),persen:'Dibahas dalam perjanjian',st:'Diajukan',akhir:'',masuk:0},'Pengajuan aset kelola '+id);closeSheet();toast('Aset diajukan. Admin akan memverifikasi data dan statusnya.');
  }else if(k==='tx'){
    const n=+v('t-n'), j=v('t-j'), st=(j==='keluar'&&n>5000000)?'Menunggu persetujuan pengurus':'Menunggu verifikasi', id=DB.nextId('TX','TX',3);
    DB.add('TX',{id,d:v('t-d'),j,kat:v('t-k'),n,ref:v('t-r'),bukti:file('t-b'),ket:v('t-e'),st},'Mencatat '+id+' ('+rp(n)+', '+v('t-k')+')');closeSheet();toast(st.startsWith('Menunggu persetujuan')?'Tersimpan. Pengeluaran besar menunggu persetujuan pengurus.':'Transaksi tersimpan.');
  }else if(k==='pakai'){
    const n=+v('p-n'), t=totals(), tertunda=sum(HASILPAKAI.filter(h=>!/Disetujui|Ditolak/.test(h.st)),h=>h.n);
    if(n>t.sisaHasil-tertunda){toast('Nominal melebihi sisa hasil ('+rp(t.sisaHasil-tertunda)+'). Dana pokok tidak dapat dipakai.');return}
    DB.add('HASILPAKAI',{id:DB.nextId('HP','HASILPAKAI',2),d:todayISO(),n,al:v('p-p'),ket:v('p-k'),st:'Menunggu persetujuan'},'Mengajukan alokasi hasil Dana Abadi '+rp(n));closeSheet();toast('Diajukan ke pengurus.');
  }else if(k==='alih'){
    if(!ALIHOK()){toast(alihMsg());return}
    addAudit('Pengajuan pengalihan partisipasi dari '+v('a-d')+' kepada '+v('a-k'));closeSheet();toast('Diajukan. Pengalihan berlaku setelah pengurus menyetujui.');
  }else if(k==='aset'&&e.target.dataset.ref){
    if(!canManage('aset'))return;
    const ref=e.target.dataset.ref,a=ASET.find(x=>x.id===ref),nm=v('s-n').trim(),pr=Math.max(0,Math.min(100,+v('s-p')||0));
    if(!a){toast('Aset tidak ditemukan.');return}
    if(!nm){toast('Nama aset wajib diisi.');return}
    const lama=a.n;
    DB.update('ASET',ref,{n:nm,j:v('s-j'),lok:v('s-l'),luas:+v('s-u'),hukum:v('s-h'),kelola:v('s-k'),sumber:v('s-s')||'-',nilai:+v('s-v'),st:v('s-t'),prog:pr,dampak:v('s-d')},'Mengubah aset '+ref+' ('+nm+')');
    if(lama!==nm){TX.forEach(t=>{if(t.ref===lama)t.ref=nm});PROYEK.forEach(r=>{if(r.aset===lama)r.aset=nm});DB.save()}
    closeSheet();toast('Perubahan aset tersimpan.');
  }else if(k==='aset'){
    if(!canManage('aset')&&!(S.role==='partisipan'&&ME))return;
    const id=DB.nextId('AB','ASET',2),pr=Math.max(0,Math.min(100,+v('s-p')||0));
    DB.add('ASET',{id,n:v('s-n'),j:v('s-j'),lok:v('s-l'),luas:+v('s-u'),hukum:v('s-h'),kelola:v('s-k'),sumber:v('s-s')||'-',nilai:+v('s-v'),st:v('s-t'),prog:pr,masuk:0,keluar:0,dok:[],rawat:'',dampak:v('s-d'),oleh:(S.role==='partisipan'&&ME)?ME.id:''},'Menambah aset '+id+' ('+v('s-n')+')');closeSheet();toast('Aset tersimpan.');
  }else if(k==='proyek'){
    if(!canManage('proyek'))return;
    const ref=e.target.dataset.ref,pr=Math.max(0,Math.min(100,+v('r-p')||0)),nm=v('r-n').trim();
    if(!nm){toast('Nama proyek wajib diisi.');return}
    const dt={n:nm,aset:v('r-a'),target:+v('r-t'),real:Math.max(0,+v('r-r')||0),prog:pr,tim:v('r-m').trim()||'-',next:v('r-x').trim()||'-'};
    if(ref){if(!DB.update('PROYEK',ref,dt,'Mengubah proyek '+ref+' ('+nm+')')){toast('Proyek tidak ditemukan.');return}closeSheet();toast('Perubahan proyek tersimpan.')}
    else{const id=DB.nextId('PR','PROYEK',2);DB.add('PROYEK',Object.assign({id},dt),'Menambah proyek '+id+' ('+nm+')');closeSheet();toast('Proyek tersimpan.')}
  }else if(k==='keg'){
    if(S.role!=='admin')return;
    const id=DB.nextId('KG','KEG',2);
    DB.add('KEG',{id,t:v('k-t'),d:v('k-d'),tmp:v('k-p'),k:v('k-k')},'Menambah kegiatan '+id+' ('+v('k-t')+')');closeSheet();toast('Kegiatan tersimpan.');
  }else if(k==='ide'){
    e.target.reset();toast('Usulan terkirim. Terima kasih.');return;
  }else if(k==='info'){
    if(S.role!=='admin')return;
    DB.add('INFO',{t:v('in-t'),d:todayISO(),b:v('in-b'),k:'Pengumuman'},'Menerbitkan pengumuman');toast('Pengumuman terbit.');
  }
  rerender();
});

Object.assign(A,{
  asetEdit:v=>{const a=ASET.find(x=>x.id===v);if(!a||!canManage('aset'))return;sheet(FORMS.aset(a));const g=i=>document.getElementById(i);if(g('s-j'))g('s-j').value=a.j;if(g('s-t'))g('s-t').value=a.st;if(g('s-d'))g('s-d').value=a.dampak||''},

  asetHapusOk:v=>{const a=ASET.find(x=>x.id===v);if(!a||!canManage('aset'))return;DB.remove('ASET',v,'Menghapus aset '+v+' ('+a.n+')');closeSheet();toast('Aset dihapus.');rerender()},

  lahanHapus:v=>{const l=DB.find('LAHAN',v);if(!l||S.role!=='admin')return;

  lahanHapusOk:v=>{const l=DB.find('LAHAN',v);if(!l||S.role!=='admin')return;DB.remove('LAHAN',v,'Menghapus aset kelola '+v+' ('+l.pemilik+')');closeSheet();toast('Aset kelola dihapus.');rerender()}
});

/* ---- splash: tampil setelah menu Masuk dipilih ---- */
(function(){
  const W=[['M-20 120 C40 40 100 40 160 110 S270 190 330 110 S390 60 430 90','spg1',2.2],
           ['M-20 150 C50 90 110 95 170 145 S280 205 340 150 S395 120 430 140','spg2',2.6],
           ['M-20 90 C30 130 95 140 155 95 S255 40 325 80 S392 125 430 80','spg3',1.8]];
  const G=[['#F68A33','#EE4363'],['#7A2C8C','#1386B3'],['#1386B3','#43B182']];
  /* logo header -> animasi Lottie (JSON dibuat dari path logo) */
  function logoLot(){
    const doc=new DOMParser().parseFromString(LOGO_RAW,'image/svg+xml'),OX=270,OY=70,FR=108;
    const gd=id=>{const g=doc.querySelector('[id="'+id+'"]'),n=k=>+g.getAttribute(k);
      const st=[...g.querySelectorAll('stop')],f=[];st.forEach(x=>{const c=hex(x.getAttribute('stop-color'));f.push(+x.getAttribute('offset'),c[0],c[1],c[2])});
      return{s:[n('x1')-OX,n('y1')-OY],e:[n('x2')-OX,n('y2')-OY],p:st.length,f}};
    const bez=d=>{const t=d.match(/[MLCZ]|-?\d*\.?\d+/g);let k=0;const v=[],I=[],O=[];
      const pt=()=>{const x=+t[k++]-OX,y=+t[k++]-OY;return[x,y]};
      while(k<t.length){const c=t[k++];
        if(c==='M'||c==='L'){const q=pt();v.push(q);I.push([0,0]);O.push([0,0])}
        else if(c==='C'){const a=pt(),b=pt(),q=pt(),pr=v[v.length-1];O[O.length-1]=[a[0]-pr[0],a[1]-pr[1]];v.push(q);I.push([b[0]-q[0],b[1]-q[1]]);O.push([0,0])}
        else if(c==='Z'){const a=v[0],l=v[v.length-1];if(v.length>1&&Math.hypot(a[0]-l[0],a[1]-l[1])<.5){I[0]=I[I.length-1];v.pop();I.pop();O.pop()}}}
      return{v,i:I,o:O,c:true}};
    const EZ={o:{x:[.3],y:[0]},i:{x:[.3],y:[1]}};
    const kf=l=>{const o=[];l.forEach((e,j)=>{if(j&&e[0]===l[j-1][0])return;const r={t:e[0],s:Array.isArray(e[1])?e[1]:[e[1]]};if(j<l.length-1)Object.assign(r,EZ);o.push(r)});return{a:1,k:o}};
    const lay=(ind,nm,shapes,ks)=>({ddd:0,ind,ty:4,nm,ks,ao:0,shapes,ip:0,op:FR,st:0});
    const paths={};doc.querySelectorAll('path').forEach(pa=>{const m=/#(\w+)/.exec(pa.getAttribute('fill')||'');if(m)paths[m[1]]=pa.getAttribute('d')});
    /* tiga pita sebagai satu aliran: jalur tengah N ditarik sebagai matte, lalu pita bergelombang berurutan */
    const grp=(id,ph)=>{
      const sh=bez(paths[id]),g=gd(id),xs=sh.v.map(q=>q[0]),ys=sh.v.map(q=>q[1]);
      const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,t0=50+ph;
      const G=()=>({s:V(g.s),e:V(g.e),t:1,g:{p:g.p,k:V(g.f)}});
      return{ty:'gr',nm:id,it:[{ty:'sh',ks:V(sh)},Object.assign({ty:'gf',o:V(100),r:1},G()),Object.assign({ty:'gs',o:V(100),w:V(2),lc:2,lj:2,ml:4},G()),
        {ty:'tr',a:V([cx,cy]),s:V([100,100]),o:V(100),
         p:kf([[0,[cx,cy]],[t0,[cx,cy]],[t0+12,[cx,cy-9]],[t0+26,[cx,cy+4]],[t0+40,[cx,cy]],[FR,[cx,cy]]]),
         r:kf([[0,0],[t0,0],[t0+12,id==='lgB'?-1.6:1.6],[t0+26,id==='lgB'?1:-1],[t0+40,0],[FR,0]])}]}};
    const ID={a:V([0,0]),p:V([0,0]),s:V([100,100]),r:V(0),o:V(100)};
    const CL='M110 558 C150 430 205 320 260 235 C285 195 315 160 345 168 C380 178 410 300 450 385 C480 450 510 490 550 492 C640 495 720 420 790 310 C840 230 890 120 930 40';
    const jalur=bez(CL.replace(/(-?\d*\.?\d+) (-?\d*\.?\d+)/g,(m,x,y)=>(+x+OX)+' '+(+y+OY)));jalur.c=false;
    const matte=Object.assign(lay(1,'aliran',[{ty:'gr',nm:'jalur',it:[{ty:'sh',ks:V(jalur)},{ty:'st',c:V([1,1,1,1]),o:V(100),w:V(300),lc:2,lj:2,ml:4},
      {ty:'tm',nm:'alir',s:V(0),e:kf([[0,0],[54,100]]),o:V(0),m:1},{ty:'tr',p:V([0,0]),a:V([0,0]),s:V([100,100]),r:V(0),o:V(100)}]}],ID),{td:1});
    const body=Object.assign(lay(2,'pita',[grp('lgA',0),grp('lgB',7),grp('lgC',14)],ID),{tt:1});
    const el=lay(3,'bayangan',[{ty:'gr',it:[{ty:'el',d:1,s:V([620,48]),p:V([0,0])},{ty:'fl',c:V([.11,.13,.31,1]),o:V(16),r:1},{ty:'tr',p:V([0,0]),a:V([0,0]),s:V([100,100]),r:V(0),o:V(100)}]}],
      {a:V([0,0]),p:V([530,552]),r:V(0),o:kf([[0,0],[30,0],[60,100]]),s:kf([[0,[50,100]],[30,[50,100]],[60,[100,100]]])});
    return{v:'5.7.0',fr:30,ip:0,op:FR,w:990,h:600,nm:'logo',ddd:0,assets:[],layers:[matte,body,el]};
  }
  const FRL=107;
  function splash(){
    try{
      if(document.getElementById('splash'))return;
      const el=document.createElement('div');el.id='splash';el.setAttribute('role','presentation');
      const defs=G.map((g,i)=>'<linearGradient id="spg'+(i+1)+'" x1="0" x2="1"><stop offset="0" stop-color="'+g[0]+'"/><stop offset="1" stop-color="'+g[1]+'"/></linearGradient>').join('');
      const paths=W.map((w,i)=>'<path class="sp-w'+(i?' w'+(i+1):'')+'" pathLength="1" stroke="url(#'+w[1]+')" stroke-width="'+w[2]+'" opacity=".9" d="'+w[0]+'"/>').join('');
      const logo='<div class="sp-lot"></div>';
      el.innerHTML=logo+'<p class="sp-n">Aren Jariyah</p><svg class="sp-bg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>'+defs+'</defs>'+paths+'</svg>';
      document.body.appendChild(el);
      const box=el.querySelector('.sp-lot'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
      try{if(!window.lottie)throw 0;const an=lottie.loadAnimation({container:box,renderer:'svg',loop:false,autoplay:!rm,animationData:logoLot()});if(rm)an.goToAndStop(FRL,true)}
      catch(e){box.innerHTML=LOGO_RAW.replace(/lg([ABCS])/g,'sl$1')}
      let done=false;const end=()=>{if(done)return;done=true;el.classList.add('out');setTimeout(()=>el.remove(),750)};
      el.addEventListener('click',end);
      setTimeout(end,matchMedia('(prefers-reduced-motion:reduce)').matches?900:3800);
    }catch(e){}
  }
  window.showSplash=splash;
  window.addEventListener('hashchange',()=>{if(location.hash==='#masuk')splash()});
  if(location.hash==='#masuk')splash();
})();
</script>
